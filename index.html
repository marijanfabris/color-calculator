<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Color Calculator</title>
</head>

<body>

    <div class="calculator">

        <h1>Color Calculator</h1>


        <div class="card">

            <div class="color-picker">

                <div class="saturation" id="saturation">

                    <div class="picker-cursor" id="pickerCursor">
                    </div>

                </div>


                <div class="hue">

                    <input type="range" id="hueSlider" min="0" max="360" value="30">

                </div>

            </div>


            <div id="colorPreview" class="color-preview">
            </div>


            <input id="hexValue" class="hex-value" value="6B6258" maxlength="6" inputmode="text" autocomplete="off"
                spellcheck="false">

        </div>


        <div class="card">

            <label for="waxMass">
                Wax mass (g)
            </label>

            <input type="number" id="waxMass" value="30" min="0" step="0.1" inputmode="decimal">

            <label for="baseColor">
                Base wax color
            </label>

            <select id="baseColor" class="base-wax">
                <option value="wax" selected>Wax base (#FFFFE7)</option>
                <option value="white">Pure white (#FFFFFF)</option>
            </select>

        </div>


        <div class="card">


            <table>

                <thead>

                    <tr>
                        <th>Color</th>
                        <th>Mix %</th>
                        <th>grams</th>
                    </tr>

                </thead>

 
                <tbody>

                    <tr>
                        <td>Black</td>
                        <td id="blackPercent">0%</td>
                        <td id="blackGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>Blue</td>
                        <td id="bluePercent">0%</td>
                        <td id="blueGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>Red</td>
                        <td id="redPercent">0%</td>
                        <td id="redGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>Magenta</td>
                        <td id="magentaPercent">0%</td>
                        <td id="magentaGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>Yellow</td>
                        <td id="yellowPercent">0%</td>
                        <td id="yellowGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>Orange</td>
                        <td id="orangePercent">0%</td>
                        <td id="orangeGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>Green</td>
                        <td id="greenPercent">0%</td>
                        <td id="greenGrams">0 g</td>
                    </tr>

                    <tr>
                        <td>White</td>
                        <td id="whitePercent">0%</td>
                        <td id="whiteGrams">0 g</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
